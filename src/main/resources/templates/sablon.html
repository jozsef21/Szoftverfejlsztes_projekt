<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charSet="UTF-8">
    <title>Sablon Oldal</title>
</head>
<body>

<p id="szovegMezo">Helló.</p>
<button type="button" onclick="szovegetValtoztat()">Szöveg változtatása</button>
<button type="button" onclick="oldaltValtoztat()">Műsor oldalra</button>

<script>

    function szovegetValtoztat() {
        document.getElementById("szovegMezo").innerText = "A szöveg változik!";
    }

    function oldaltValtoztat() {
        window.location.href = "musor";
    }
</script>

</body>
</html>
