<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<!-- a head rész injektálása -->
<head th:replace="~{/fragments :: common-head('Absolute Cinema')}"></head>

<body>
    <div class="start_tartalom">
        <!-- 50-50 Split Container -->
        <div class="felezo-container">
            <div class="bal-oldal">
                <div class="nav-box" onclick="location.href='/login'">Bejelentkezés</div>
                <div class="nav-box" onclick="location.href='/termek'">Termek</div>
                <div class="nav-box" onclick="location.href='/musor'">Filmek</div>
                <div class="nav-box" onclick="location.href='/bufe'">Büfé Menu</div>
            </div>

            <div class="jobb-oldal">
                <h2>Üdvözöljük az Absolute Cinema-ban!</h2>
                <p>Itt találhatja a legfrissebb információkat a termeinkről, vetítésekről és aktuális akcióinkról.</p>
            </div>
        </div>

        <div class="ajanlott_kontener">
            <h3>Ajánlott filmjeink</h3>
            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">

                <div th:each="film : ${randomFilmek}" class="filmkep">
                    <img th:src="${film.plakat}" th:alt="${film.cim}" />
                </div>

            </div>
        </div>

    </div>
</body>
</html>
